{
    "version": 9,
    "name": "Iron Storm",
    "icon": "Icon.png",
    "fileformats": [
        { "format": "Valve", "initialmap": "initial_valve.map" }
    ],
    "filesystem": {
        "searchpath": ".",
        "packageformat": { "extension": ".zip", "format": "zip" }
    },
    "materials": {
        "root": "textures",
        "extensions": [".png", ".jpg", ".jpeg", ".tga"]
    },
    "entities": {
        "definitions": [ "IronStorm.fgd" ],
        "defaultcolor": "0.6 0.6 0.6 1.0"
    },
    "tags": {
        "brush": [
            { "name": "Detail", "attribs": [], "match": "classname", "pattern": "func_detail*" }
        ],
        "brushface": [
            { "name": "Clip", "attribs": [ "transparent" ], "match": "material", "pattern": "special/clip" },
            { "name": "Nodraw", "attribs": [ "transparent" ], "match": "material", "pattern": "special/nodraw" },
            { "name": "Skip", "attribs": [ "transparent" ], "match": "material", "pattern": "special/skip" },
            { "name": "Sky", "attribs": [ "transparent" ], "match": "material", "pattern": "special/sky" }
        ]
    },
    "faceattribs": {
        "defaults": { "scale": [1.0, 1.0] },
        "surfaceflags": [],
        "contentflags": []
    },
    "softMapBounds": "-8192 -8192 -4096 8192 8192 4096"
}
